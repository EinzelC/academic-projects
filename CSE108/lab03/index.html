<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- 1. Output field -->
        <div class="display" id="display">0</div>
        
        <!-- 6. Arranged in a grid -->
        <div class="calc-grid">
            <!-- Row 1 -->
            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="clear" data-action="clear">C</button>
            
            <!-- Row 2 -->
            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-action="operator" data-value="/">/</button>
        
            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-action="operator" data-value="*">*</button>

            <button class="number zero" data-value="0">0</button>
            <button class="decimal" data-action="decimal">.</button>
            <button class="operator" data-action="operator" data-value="-">-</button>

            <button class="equals" data-action="calculate" id="equals-btn">=</button>
            <button class="operator" data-action="operator" data-value="+" id="plus-btn">+</button>

        </div>
    </div>

    <!-- Load JS at the end so HTML elements are ready -->
    <script src="script.js"></script>
</body>
</html>
